name: Windows read-only environment probe
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/windows-environment-probe.yml']
permissions:
  contents: read
jobs:
  inspect:
    if: github.repository == 'cureflash/live2d-agent' && github.actor == 'cureflash' && github.ref == 'refs/heads/main'
    runs-on: [self-hosted, Windows, X64, live2d-agent]
    timeout-minutes: 5
    steps:
      - name: Inspect session and installed build tools without CeVIO access
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $result = [ordered]@{
            Kind = 'environment_inventory_not_rendering_validation'
            ReceivedUtc = [DateTime]::UtcNow.ToString('o')
            Is64BitProcess = [Environment]::Is64BitProcess
            UserInteractive = [Environment]::UserInteractive
            SessionId = (Get-Process -Id $PID).SessionId
            PowerShellVersion = $PSVersionTable.PSVersion.ToString()
            CeVIOAccessed = $false
          }
          $vswhere = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio\Installer\vswhere.exe'
          $result.VswhereFound = Test-Path -LiteralPath $vswhere -PathType Leaf
          if ($result.VswhereFound) {
            $vsJson = & $vswhere -products '*' -format json
            if ($LASTEXITCODE -ne 0) { throw 'vswhere inventory failed.' }
            $result.VisualStudio = @($vsJson | ConvertFrom-Json | ForEach-Object {
              [pscustomobject]@{ Version = $_.installationVersion; Complete = $_.isComplete }
            })
            $cppPaths = @(& $vswhere -products '*' -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath)
            if ($LASTEXITCODE -ne 0) { throw 'vswhere C++ query failed.' }
            $result.CppToolchainInstallations = $cppPaths.Count
            $result.VisualStudioBundledCMake = @($cppPaths | Where-Object {
              Test-Path -LiteralPath (Join-Path $_ 'Common7\IDE\CommonExtensions\Microsoft\CMake\CMake\bin\cmake.exe') -PathType Leaf
            }).Count
          }
          $result.CMakeOnPath = $null -ne (Get-Command cmake.exe -ErrorAction SilentlyContinue)
          $result.GitOnPath = $null -ne (Get-Command git.exe -ErrorAction SilentlyContinue)
          $result.NodeOnPath = $null -ne (Get-Command node.exe -ErrorAction SilentlyContinue)
          $scanErrors = @()
          $sdkHeaders = @()
          foreach ($folder in @('Desktop','Documents','Downloads')) {
            $root = Join-Path $env:USERPROFILE $folder
            if (Test-Path -LiteralPath $root -PathType Container) {
              $sdkHeaders += @(Get-ChildItem -LiteralPath $root -Recurse -File -Filter '*Cubism*' -ErrorAction SilentlyContinue -ErrorVariable +scanErrors | Where-Object { $_.Name -eq 'Live2DCubismCore.h' })
            }
          }
          $additionalCandidates = @()
          $additionalErrors = @()
          foreach ($folder in @('Desktop','Documents','Downloads')) {
            $root = Join-Path $env:USERPROFILE $folder
            if (Test-Path -LiteralPath $root -PathType Container) {
              $additionalCandidates += @(Get-ChildItem -LiteralPath $root -Recurse -File -Filter '*Cubism*' -ErrorAction SilentlyContinue -ErrorVariable +additionalErrors |
                Where-Object { $_.Name -eq 'Live2DCubismCore.lib' -or $_.Name -like '*Cubism*SDK*.zip' -or $_.Name -like 'CubismEditor*.exe' })
            }
          }
          $result.AdditionalCandidateCount = $additionalCandidates.Count
          $result.AdditionalSearchErrorCount = $additionalErrors.Count
          $result.SdkCandidateTypes = @($sdkHeaders | Group-Object Extension | ForEach-Object {
            [pscustomobject]@{ Extension = $_.Name; Count = $_.Count }
          })
          $result.SearchErrorCount = $scanErrors.Count
          $result.SearchErrorDetails = @($scanErrors | ForEach-Object {
            $errorPath = [string]$_.TargetObject
            $exists = $null
            $parentExists = $null
            $reparse = $null
            if ($errorPath) {
              $exists = Test-Path -LiteralPath $errorPath -ErrorAction SilentlyContinue
              $parentPath = Split-Path -LiteralPath $errorPath -ErrorAction SilentlyContinue
              if ($parentPath) { $parentExists = Test-Path -LiteralPath $parentPath -ErrorAction SilentlyContinue }
              $item = Get-Item -LiteralPath $errorPath -Force -ErrorAction SilentlyContinue
              if ($null -ne $item) { $reparse = ($item.Attributes -band [IO.FileAttributes]::ReparsePoint) -ne 0 }
            }
            $longFilterErrors = @()
            $shortFilterErrors = @()
            $shortItems = @()
            if ($exists) {
              $null = @(Get-ChildItem -LiteralPath $errorPath -File -Filter 'Live2DCubismCore.h' -ErrorAction SilentlyContinue -ErrorVariable +longFilterErrors)
              $shortItems = @(Get-ChildItem -LiteralPath $errorPath -File -Filter '*' -ErrorAction SilentlyContinue -ErrorVariable +shortFilterErrors)
            }
            [pscustomobject]@{
              LongFilterErrorCount = $longFilterErrors.Count
              ShortFilterErrorCount = $shortFilterErrors.Count
              ExactHeaderCountAfterEnumeration = @($shortItems | Where-Object { $_.Name -eq 'Live2DCubismCore.h' }).Count
              PathPlusFilterLength = $errorPath.Length + 1 + 'Live2DCubismCore.h'.Length
              Type = $_.Exception.GetType().FullName
              HResult = $_.Exception.HResult
              PathLength = $errorPath.Length
              LongestComponent = ($errorPath.Split('\') | ForEach-Object { $_.Length } | Measure-Object -Maximum).Maximum
              ExistsOnRecheck = $exists
              ParentExists = $parentExists
              ReparsePoint = $reparse
            }
          })
          $appErrors = @()
          $result.CubismRegisteredApplications = @(
            foreach ($registryRoot in @(
              'HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Uninstall\*',
              'HKLM:\SOFTWARE\WOW6432Node\Microsoft\Windows\CurrentVersion\Uninstall\*',
              'HKCU:\SOFTWARE\Microsoft\Windows\CurrentVersion\Uninstall\*'
            )) {
              Get-ItemProperty -Path $registryRoot -ErrorAction SilentlyContinue -ErrorVariable +appErrors |
                Where-Object { $_.DisplayName -like '*Cubism*' -or $_.DisplayName -like '*Live2D*' } |
                ForEach-Object { [pscustomobject]@{ Name = $_.DisplayName; Version = $_.DisplayVersion } }
            }
          )
          $result.RegistrySearchErrorCount = $appErrors.Count
          $result.InstallRootCandidates = @(
            foreach ($installRoot in @($env:ProgramFiles, [Environment]::GetEnvironmentVariable('ProgramFiles(x86)'), (Join-Path $env:LOCALAPPDATA 'Programs'))) {
              if (Test-Path -LiteralPath $installRoot -PathType Container) {
                $namedDirs = @(Get-ChildItem -LiteralPath $installRoot -Directory -ErrorAction SilentlyContinue |
                  Where-Object { $_.Name -like '*Live2D*' -or $_.Name -like '*Cubism*' })
                foreach ($namedDir in $namedDirs) {
                  $installScanErrors = @()
                  $headers = @(Get-ChildItem -LiteralPath $namedDir.FullName -Recurse -File -Filter 'Live2DCubismCore.h' -ErrorAction SilentlyContinue -ErrorVariable +installScanErrors)
                  [pscustomobject]@{ DirectoryName = $namedDir.Name; CoreHeaderCount = $headers.Count; ErrorCount = $installScanErrors.Count }
                }
              }
            }
          )
          $result.SearchScope = 'Desktop Documents Downloads; named install directories; uninstall registry. Not a complete disk inventory.'
          $result | ConvertTo-Json -Depth 5

      - name: Inspect downloaded Cubism SDK archive without extraction or execution
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $root = Join-Path $env:USERPROFILE 'Downloads'
          $archiveErrors = @()
          $archives = @(Get-ChildItem -LiteralPath $root -Recurse -File -Filter '*Cubism*' -ErrorAction SilentlyContinue -ErrorVariable +archiveErrors |
            Where-Object { $_.Name -like '*Cubism*SDK*.zip' })
          [pscustomobject]@{ Kind = 'sdk_archive_inventory_not_build_validation'; ArchiveCount = $archives.Count; SearchErrorCount = $archiveErrors.Count; CeVIOAccessed = $false } | ConvertTo-Json
          if ($archiveErrors.Count -gt 0) { throw 'SDK archive search was incomplete.' }
          if ($archives.Count -eq 0) { throw 'No Cubism SDK ZIP found in Downloads.' }
          foreach ($archiveFile in $archives) {
            $zip = $null
            try {
              $zip = [IO.Compression.ZipFile]::OpenRead($archiveFile.FullName)
              $names = @($zip.Entries | ForEach-Object { $_.FullName.Replace('\','/') })
              $versionLabel = 'unrecognized_filename'
              if ($archiveFile.Name -match '^CubismSdkForNative-[0-9A-Za-z_.()-]+\.zip$') { $versionLabel = $archiveFile.Name }
              [pscustomobject]@{
                Archive = $versionLabel
                Bytes = $archiveFile.Length
                SHA256 = (Get-FileHash -LiteralPath $archiveFile.FullName -Algorithm SHA256).Hash
                EntryCount = $names.Count
                CoreHeaders = @($names | Where-Object { $_ -like '*/Core/include/Live2DCubismCore.h' })
                WindowsLibraries = @($names | Where-Object { $_ -like '*/Core/lib/windows/*' -and $_ -like '*.lib' })
                FrameworkCMake = @($names | Where-Object { $_ -like '*/Framework/CMakeLists.txt' })
                WindowsSampleCMake = @($names | Where-Object { $_ -like '*/Samples/*/CMakeLists.txt' -and $_ -like '*D3D11*' })
                ReadmeFiles = @($names | Where-Object { $_ -like '*/README*' -and $_.Split('/').Count -le 2 })
              } | ConvertTo-Json -Depth 4
              foreach ($entry in $zip.Entries) {
                $name = $entry.FullName.Replace('\','/')
                if ($name -like '*/Samples/D3D11/Demo/CMakeLists.txt' -or ($name -like '*/README.md' -and $name.Split('/').Count -eq 2)) {
                  if ($entry.Length -gt 24000) { Write-Output 'SDK document omitted due to size.'; continue }
                  $reader = New-Object IO.StreamReader($entry.Open())
                  try { $document = $reader.ReadToEnd() } finally { $reader.Dispose() }
                  Write-Output ('SDK_DOCUMENT ' + $name)
                  Write-Output $document
                }
              }
            } catch {
              Write-Output ('Archive inspection failed: ' + $_.Exception.GetType().FullName)
              exit 1
            } finally {
              if ($null -ne $zip) { $zip.Dispose() }
            }
          }
