name: Install synchronization probe launchers
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/windows-sync-setup.yml']
permissions:
  contents: read
jobs:
  setup:
    if: github.repository == 'cureflash/live2d-agent' && github.actor == 'cureflash' && github.ref == 'refs/heads/main'
    runs-on: [self-hosted, Windows, X64, live2d-agent]
    timeout-minutes: 3
    steps:
      - name: Install pinned interactive receiver and synthesis worker
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          try {
            $base = Join-Path $env:LOCALAPPDATA 'live2d-agent'
            $target = Join-Path $base ('sync-tools-' + $env:GITHUB_RUN_ID)
            $null = New-Item -ItemType Directory -Path $target
            foreach ($name in @('Start-SyncProbe.ps1','Synthesize-AgentSpeech.ps1')) {
              $path = Join-Path $target $name
              Invoke-WebRequest -UseBasicParsing -Uri ('https://raw.githubusercontent.com/cureflash/live2d-agent/b89340e4717aae95be16681395674bc670fa117c/probes/' + $name) -OutFile $path
              $tokens = $null; $parseErrors = $null
              $null = [Management.Automation.Language.Parser]::ParseFile($path, [ref]$tokens, [ref]$parseErrors)
              if ($parseErrors.Count -gt 0) { throw 'Script parse failed.' }
            }
            if (-not (Test-Path -LiteralPath (Join-Path $base 'sync-build.json'))) { throw 'Native build not available.' }
            foreach ($item in @(@('Launch-SyncSpeech.cmd',''), @('Launch-SyncReceive.cmd',' -WaitForNotification'))) {
              @('@echo off', ('powershell.exe -NoProfile -File "' + (Join-Path $target 'Start-SyncProbe.ps1') + '"' + $item[1]), 'pause') |
                Set-Content -LiteralPath (Join-Path $base $item[0]) -Encoding Default
            }
            Write-Output 'SYNC_LAUNCHERS_INSTALLED. CeVIO not accessed. Notification receiver not started.'
          } catch {
            Write-Output ('SYNC_SETUP_FAILED ' + $_.Exception.GetType().FullName)
            exit 1
          }
