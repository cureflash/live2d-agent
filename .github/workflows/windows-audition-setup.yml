name: Prepare interactive motion and voice audition
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/windows-audition-setup.yml']
permissions:
  contents: read
jobs:
  prepare:
    if: github.repository == 'cureflash/live2d-agent' && github.actor == 'cureflash' && github.ref == 'refs/heads/main'
    runs-on: [self-hosted, Windows, X64, live2d-agent]
    timeout-minutes: 5
    steps:
      - name: Install pinned audition scripts and check local prerequisites
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          try {
            $base = Join-Path $env:LOCALAPPDATA 'live2d-agent'
            $target = Join-Path $base ('audition-tools-' + $env:GITHUB_RUN_ID)
            $null = New-Item -ItemType Directory -Path $target
            foreach ($name in @('Start-MotionVoiceAudition.ps1', 'Test-CeVIO.ps1')) {
              $uri = 'https://raw.githubusercontent.com/cureflash/live2d-agent/d6389443023a7f74c7463a15028d7d40bbab31d9/probes/' + $name
              $path = Join-Path $target $name
              Invoke-WebRequest -UseBasicParsing -Uri $uri -OutFile $path
              $tokens = $null
              $parseErrors = $null
              $null = [Management.Automation.Language.Parser]::ParseFile($path, [ref]$tokens, [ref]$parseErrors)
              if ($parseErrors.Count -gt 0) { throw 'Downloaded script has syntax errors.' }
            }
            & (Join-Path $target 'Start-MotionVoiceAudition.ps1') -PrepareOnly
            if (-not $?) { throw 'Audition preflight failed.' }
            @('@echo off', ('powershell.exe -NoProfile -File "' + (Join-Path $target 'Start-MotionVoiceAudition.ps1') + '"'), 'pause') |
              Set-Content -LiteralPath (Join-Path $base 'Launch-MotionVoice.cmd') -Encoding Default
            Write-Output 'AUDITION_PREPARED. No model launched. No CeVIO connection. Playback requires interactive launcher.'
          } catch {
            Write-Output ('AUDITION_SETUP_FAILED ' + $_.Exception.GetType().FullName)
            exit 1
          }
