name: Deliver one fixed synchronization test notification
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['probes/sync-notification.json']
permissions:
  contents: read
concurrency:
  group: live2d-agent-sync-delivery
  cancel-in-progress: false
jobs:
  deliver:
    if: github.repository == 'cureflash/live2d-agent' && github.actor == 'cureflash' && github.ref == 'refs/heads/main'
    runs-on: [self-hosted, Windows, X64, live2d-agent]
    timeout-minutes: 3
    steps:
      - name: Deliver data to an explicitly opened one-shot receiver
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          try {
            $base = Join-Path $env:LOCALAPPDATA 'live2d-agent'
            $pointerPath = Join-Path $base 'sync-session.json'
            if (-not (Test-Path -LiteralPath $pointerPath)) { throw 'No interactive receiver; start Launch-SyncReceive.cmd first.' }
            $pointer = Get-Content -LiteralPath $pointerPath -Raw -Encoding UTF8 | ConvertFrom-Json
            if ($pointer.SessionId -cnotmatch '^[0-9a-f]{32}$') { throw 'Invalid session.' }
            $session = Join-Path $base ('sync-session-' + $pointer.SessionId)
            if ([IO.Path]::GetFullPath([string]$pointer.Directory) -ine $session) { throw 'Invalid receiver directory.' }
            $receiver = Get-Process -Id $pointer.ReceiverPid
            if ($receiver.ProcessName -ine 'powershell' -or $receiver.StartTime.ToUniversalTime().ToString('o') -cne $pointer.ReceiverStartUtc) { throw 'Receiver session is no longer alive.' }
            $payloadPath = Join-Path $env:RUNNER_TEMP ('sync-test-' + $env:GITHUB_RUN_ID + '.json')
            Invoke-WebRequest -UseBasicParsing -Uri ('https://raw.githubusercontent.com/cureflash/live2d-agent/' + $env:GITHUB_SHA + '/probes/sync-notification.json') -OutFile $payloadPath
            $payload = Get-Content -LiteralPath $payloadPath -Raw -Encoding UTF8 | ConvertFrom-Json
            if ($payload.Id -cnotmatch '^[0-9a-f]{32}$' -or $payload.Source -cne 'web-chatgpt-work-test' -or $payload.Text -isnot [string] -or $payload.Text.Length -gt 280 -or [string]::IsNullOrWhiteSpace($payload.Text)) { throw 'Invalid fixed test payload.' }
            $destination = Join-Path $session 'command.json'
            $data = [ordered]@{ Id=$payload.Id; SessionId=$pointer.SessionId; Source=$payload.Source; Text=$payload.Text; SentUtc=$payload.SentUtc; DeliveredUtc=[DateTime]::UtcNow.ToString('o') }
            if (Test-Path -LiteralPath $destination) {
              $existing = Get-Content -LiteralPath $destination -Raw -Encoding UTF8 | ConvertFrom-Json
              if ($existing.Id -cne $data.Id -or $existing.Text -cne $data.Text) { throw 'One-shot receiver already has another command.' }
              Write-Output 'DELIVERY_DUPLICATE_SAME_COMMAND'
            } else {
              $temp = Join-Path $session ([guid]::NewGuid().ToString('N') + '.tmp')
              [IO.File]::WriteAllText($temp, ($data | ConvertTo-Json), (New-Object Text.UTF8Encoding($false)))
              [IO.File]::Move($temp, $destination)
              Write-Output ('DELIVERED id=' + $data.Id)
            }
            $statusPath = Join-Path $session ('runtime\speech\' + $data.Id + '.status')
            $timer = [Diagnostics.Stopwatch]::StartNew()
            do {
              Start-Sleep -Milliseconds 500
              $events = if (Test-Path -LiteralPath $statusPath) { [IO.File]::ReadAllText($statusPath) } else { '' }
              if ($timer.Elapsed.TotalSeconds -gt 90) { throw 'Delivered, but playback completion was not confirmed.' }
            } until ($events.Contains('playback_completed'))
            Write-Output 'NATIVE_PLAYBACK_COMPLETED. Audible speech and visual synchronization need user confirmation.'
          } catch {
            Write-Output ('DELIVERY_PROBE_FAILED ' + $_.Exception.GetType().FullName + ' ' + $_.Exception.Message.Replace($env:USERPROFILE, '<user>'))
            exit 1
          }
