name: Windows mouth diagnostic
on:
  push:
    branches: [main]
    paths: ['.github/workflows/windows-mouth-diagnostic.yml']
permissions:
  contents: read
jobs:
  diagnose:
    if: github.repository == 'cureflash/live2d-agent' && github.actor == 'cureflash' && github.ref == 'refs/heads/main'
    runs-on: [self-hosted, Windows, X64, live2d-agent]
    timeout-minutes: 5
    steps:
      - name: Inspect private model mouth metadata without changing assets
        shell: powershell
        run: |
          Set-StrictMode -Version Latest
          $ErrorActionPreference = 'Stop'
          $base = Join-Path $env:LOCALAPPDATA 'live2d-agent'
          $built = Get-Content -LiteralPath (Join-Path $base 'expression-build.json') -Raw -Encoding UTF8 | ConvertFrom-Json
          $source = [IO.Path]::GetFullPath([string]$built.WorkingDirectory)
          if (-not $source.StartsWith($base + '\expression-runtime-', [StringComparison]::OrdinalIgnoreCase)) { throw 'Unexpected expression runtime.' }
          $modelDir = Join-Path $source 'Resources\model'
          $config = Get-Content -LiteralPath (Join-Path $modelDir 'model.model3.json') -Raw -Encoding UTF8 | ConvertFrom-Json
          $lipGroups = @($config.Groups | Where-Object { $_.Target -eq 'Parameter' -and $_.Name -eq 'LipSync' })
          $lipIds = @($lipGroups | ForEach-Object { @($_.Ids) } | Select-Object -Unique)
          if ($lipIds.Count -eq 0) { throw 'No LipSync parameter configured.' }

          $expressionTouches = @()
          foreach ($entry in @($config.FileReferences.Expressions)) {
            $data = Get-Content -LiteralPath (Join-Path $modelDir ([string]$entry.File)) -Raw -Encoding UTF8 | ConvertFrom-Json
            foreach ($p in @($data.Parameters)) {
              if ($lipIds -contains [string]$p.Id) {
                $expressionTouches += [pscustomobject]@{ Id=[string]$p.Id; Value=[double]$p.Value; Blend=[string]$p.Blend }
              }
            }
          }

          $motionTouches = @()
          foreach ($group in $config.FileReferences.Motions.PSObject.Properties) {
            foreach ($entry in @($group.Value)) {
              $data = Get-Content -LiteralPath (Join-Path $modelDir ([string]$entry.File)) -Raw -Encoding UTF8 | ConvertFrom-Json
              foreach ($curve in @($data.Curves)) {
                if ($curve.Target -eq 'Parameter' -and $lipIds -contains [string]$curve.Id) {
                  $motionTouches += [pscustomobject]@{ Id=[string]$curve.Id; FadeInTime=$(if($null -ne $curve.FadeInTime){[double]$curve.FadeInTime}else{$null}); FadeOutTime=$(if($null -ne $curve.FadeOutTime){[double]$curve.FadeOutTime}else{$null}) }
                }
              }
            }
          }

          [ordered]@{
            Kind='mouth_metadata_diagnostic'
            LipSyncGroupCount=$lipGroups.Count
            LipSyncIds=$lipIds
            ExpressionTouchCount=$expressionTouches.Count
            ExpressionTouches=$expressionTouches
            MotionTouchCount=$motionTouches.Count
            MotionTouches=$motionTouches
            AudioPlayed=$false
            RendererStarted=$false
            SourceAssetsModified=$false
            ModelImageExposed=$false
            LocalPathExposed=$false
          } | ConvertTo-Json -Depth 8
